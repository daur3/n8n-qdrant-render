services:
  # 1. Сервис Qdrant (Векторная база знаний)
  - type: web
    name: qdrant-db
    env: docker
    region: frankfurt
    plan: free
    image:
      url: qdrant/qdrant:latest
    envVars:
      - key: QDRANT__SERVICE__HTTP_PORT
        value: 6333

  # 2. Сервис n8n (Автоматизация и AI-агент)
  - type: web
    name: n8n-automation
    env: docker
    region: frankfurt
    plan: free
    image:
      url: docker.n8n.io/n8nio/n8n:latest
    envVars:
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n-automation.onrender.com/
      - key: GENERIC_TIMEZONE
        value: Europe/Moscow
      mountPath: /home/node/.n8n
      sizeGB: 1
